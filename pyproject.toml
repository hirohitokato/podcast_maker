[project]
name = "podcast-maker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.72",
    "dotenv>=0.9.9",
]

[project.scripts]
podcast = "src.cli:main"
test = "tests.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "tests"]
